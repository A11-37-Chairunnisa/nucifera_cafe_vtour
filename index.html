<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nucifera Cafe | Interactive Virtual Tour</title>
  <!-- Pannellum loads from the CDN; an internet connection is required. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #0f172a; color: #fff; }
    header { padding: 14px 22px; background: #17243a; }
    h1 { margin: 0; font-size: 1.35rem; }
    .intro { margin: 6px 0 0; color: #d3e2f1; font-size: .95rem; }
    #panorama { width: 100%; height: calc(100vh - 116px); min-height: 380px; }
    footer { min-height: 46px; padding: 13px 22px; background: #17243a; color: #cbd5e1; font-size: .86rem; }
    footer span { color: #9bd8f2; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Nucifera Cafe | Interactive Virtual Tour</h1>
    <p class="intro">Drag to look around. Click arrows to change locations; click info icons for explanations.</p>
  </header>
  <main><div id="panorama" aria-label="Interactive 360-degree tour"></div></main>
  <footer>Built with <span>Pannellum</span>, <span>Git</span> and <span>GitHub Pages</span>.</footer>

  <script>
    pannellum.viewer("panorama", {
      "default": {
        "firstScene": "lantai_1",
        "sceneFadeDuration": 700,
        "autoLoad": true,
        "hfov": 110,
        "escapeHTML": true
      },
      "scenes": {
        "lantai_1": {
          "title": "Lantai 1 (Entrance)",
          "type": "equirectangular",
          "panorama": "images/Lantai_1.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Naik ke Lantai 2", "sceneId": "lantai_2"},
            {"pitch": 10, "yaw": -50, "type": "info", "text": "Selamat datang di Nucifera Cafe - Lantai 1!"}
          ]
        },
        "lantai_2": {
          "title": "Lantai 2",
          "type": "equirectangular",
          "panorama": "images/Lantai_2.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Naik ke Lantai 3", "sceneId": "lantai_3"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Kembali ke Lantai 1", "sceneId": "lantai_1"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Spot duduk indoor Lantai 2."}
          ]
        },
        "lantai_3": {
          "title": "Lantai 3",
          "type": "equirectangular",
          "panorama": "images/Lantai_3.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": -7, "yaw": 100, "type": "scene", "text": "Kembali ke Lantai 2", "sceneId": "lantai_2"},
            {"pitch": 9, "yaw": 5, "type": "info", "text": "Spot Outdoor Lantai 3."}
          ]
        }
      }
    });
  </script>
</body>
</html>
